[storage]
base_dir = "C:\\Users\\azovl\\OneDrive\\Antigravity\\Project\\RAG_EmbeddingGemma2\\test\\RAG_EG2"
lancedb_dir = "C:\\Users\\azovl\\OneDrive\\Antigravity\\Project\\RAG_EmbeddingGemma2\\test\\RAG_EG2\\lancedb"
models_dir = "C:\\Users\\azovl\\OneDrive\\Antigravity\\Project\\RAG_EmbeddingGemma2\\test\\RAG_EG2\\models"

[indexing]
skip_cloud_placeholders = true
exclude_patterns = [
    ".git",
    "node_modules",
    "target",
    "dist",
    "__pycache__",
    ".obsidian",
    ".trash",
]

[[indexing.target_paths]]
name = "TestTarget"
path = "C:\\Users\\azovl\\OneDrive\\Antigravity\\Project\\RAG_EmbeddingGemma2\\test\\target"
enabled = true

[[bundles]]
id = "test-python"
name = "테스트 파이썬 묶음"
description = "테스트 파이썬 및 주피터 노트북 파일 묶음"
icon = "FileCode"
preset = "python"
paths = ["C:\\Users\\azovl\\OneDrive\\Antigravity\\Project\\RAG_EmbeddingGemma2\\test\\target\\python_project"]
extensions = ["py", "ipynb", "pyi"]
enabled = true

[[bundles]]
id = "test-cpp"
name = "테스트 C/C++ 묶음"
description = "테스트 C++ 헤더 및 소스 파일 묶음"
icon = "Cpu"
preset = "cpp"
paths = ["C:\\Users\\azovl\\OneDrive\\Antigravity\\Project\\RAG_EmbeddingGemma2\\test\\target\\cpp_project"]
extensions = ["cpp", "hpp", "c", "h"]
enabled = true

[[bundles]]
id = "test-markdown"
name = "테스트 마크다운 문서 묶음"
description = "테스트 Obsidian 및 Gemini-Spark 마크다운 문서 묶음"
icon = "BookOpen"
preset = "markdown"
paths = ["C:\\Users\\azovl\\OneDrive\\Antigravity\\Project\\RAG_EmbeddingGemma2\\test\\target"]
extensions = ["md", "markdown"]
enabled = true

[inference]
device = "npu"
vector_dim = 256

[resource_governor]
enabled = true
max_cpu_percent = 65.0
max_ram_percent = 80.0
